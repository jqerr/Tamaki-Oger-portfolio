<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Tamaki Oger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a class="ig-link" href="https://www.instagram.com/tamaki.o20/" target="_blank" rel="noopener">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
      <circle cx="12" cy="12" r="4.6"/>
      <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>
    </svg>
  </a>
  <h1 class="site-title"><a href="index.html">Tamaki Oger</a></h1>
  <nav class="site-nav">
    <a href="index.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<div class="contact-block">
  <h1>send a message</h1>
  <p class="email">by this form or at <a href="mailto:mail@jotamaki.net">mail@jotamaki.net</a></p>

  <form class="contact-form"
        action="https://script.google.com/macros/s/AKfycbzo-V1YzIoEfORQQ7k-EsYFzcI_E8DlCtANXnDE6N9DU8idzhs4Z7FriWFvZsn3hJfDuQ/exec"
        method="POST"
        target="hidden_iframe"
        onsubmit="document.getElementById('form-status').textContent='Sending…';">
    <label for="name">name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">email:</label>
    <input type="email" id="email" name="email" required>

    <label for="message">message:</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">send</button>
    <p id="form-status"></p>
  </form>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"
          onload="if(window.formSubmitted){document.getElementById('form-status').textContent='Message sent — thank you!'; document.querySelector('.contact-form').reset();} window.formSubmitted=true;"></iframe>
</div>

</body>
</html>
